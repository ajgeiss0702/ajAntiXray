plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'legendary.hardcore'
version = '2.1.0'
description = 'Detects xrayers and notifys admins'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://repo.ajg0702.us/releases' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    // Provided by the server
    compileOnly 'dev.folia:folia-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.14'

    // Only include what you actually use.
    // If you can switch to Paper’s built-in adventure and avoid bundling these, do it.
    implementation "net.kyori:adventure-api:4.26.1"
    implementation "net.kyori:adventure-text-minimessage:4.26.1"
    // Usually not needed:
    // implementation "net.kyori:adventure-platform-bukkit:4.4.1"

    // If the plugin uses Configurate at runtime, it must be shaded (implementation)
    implementation 'org.spongepowered:configurate-yaml:4.2.0'

    // Your util lib (must be shaded unless you plan to require it as a separate plugin/jar)
    implementation "us.ajg0702:ajUtils:1.1.31"
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        // Use ${version} or ${pluginName} in plugin.yml
        expand(
                version: project.version,
                pluginName: 'ajAntiXray',
                description: project.description
        )
    }
}

import org.gradle.api.file.DuplicatesStrategy

tasks.shadowJar {
    archiveBaseName.set('ajAntiXray')
    archiveClassifier.set('')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/INDEX.LIST'

    relocate 'org.spongepowered.configurate', 'us.ajg0702.antixray.libs.configurate'
    relocate 'org.yaml.snakeyaml', 'us.ajg0702.antixray.libs.snakeyaml'
}

tasks.build {
    dependsOn tasks.shadowJar
}

tasks.jar { enabled = false }